[package]
name = "cairn-trail"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Cairn trail device firmware: LILYGO T-Beam Supreme capture logger"
license-file = "../LICENSE"
publish = false

[[bin]]
name = "cairn-trail"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
# Debug-level logs, every record echoed to the console, bus scans at boot.
verbose = []

[dependencies]
trail-core = { path = "../crates/trail-core" }

esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp-alloc", "esp32s3", "log-04", "unstable", "wifi"] }
esp-storage = { version = "0.10.0", features = ["esp32s3"] }
embedded-storage = "0.3"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "log", "medium-ethernet", "proto-ipv4", "tcp"] }
embedded-io-async = "0.7.0"
embedded-tls = { version = "0.19.0", default-features = false, features = ["rustpki", "log"] }
rand_core = { version = "0.6", default-features = false }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8"] }
signature = { version = "2.2", default-features = false }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
# Not the default `auto` printer: on the ESP32-S3 its USB-host check reads
# 0x60038000, which is the USB-Serial-JTAG FIFO, not the interrupt status
# register (+0x08), so every line printed while a command was arriving
# swallowed one received byte (~10% of console commands with the verbose log
# on; 6 bytes of a provisioning payload). The console is USB only.
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "log-04", "jtag-serial", "critical-section", "colors"] }
log = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1"

embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
embedded-io = "0.7"
embedded-sdmmc = { version = "0.10.0", default-features = false }
embedded-graphics = "0.8.2"
heapless = "0.9.3"
libm = "0.2.16"
critical-section = "1.2.0"
static_cell = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
