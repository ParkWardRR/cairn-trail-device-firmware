[package]
name = "trail"
version = "0.1.0"
edition = "2024"
description = "Host tool for the Cairn trail logger: console, file pulls, provisioning, AssistNow, session checks"
license-file = "../../LICENSE"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.3"
hex = "0.4.3"
serde_json = "1.0.154"
serialport = "4.10.1"
sha2 = "0.11.1"
trail-core = { path = "../../crates/trail-core" }
ureq = { version = "3.5.0", features = ["json"] }
cairn-format = { git = "https://github.com/ParkWardRR/cairn-esp32-device-firmware", rev = "f8bd78e4f93a566d01050b30e826401784517649", features = ["std"] }
